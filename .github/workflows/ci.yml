name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

# ... other steps here ...

      - name: Run Next.js Build
        run: npm run build
        env:
          # Variable 1: Next.js needs this one to find the project.
          # This should have 2 spaces of indentation relative to 'env:'
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_STACK_PROJECT_ID }} 
          
          # Variable 2: You correctly identified this second requirement.
          # This must have 2 spaces of indentation relative to 'env:'
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}


      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint (if available)
        run: npm run lint --if-present

      - name: Build
        run: npm run build
