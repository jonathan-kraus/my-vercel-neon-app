name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Audit, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/package.json','**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache project pnpm files
        uses: actions/cache@v4
        with:
          path: |
            .pnpm
            node_modules
          key: ${{ runner.os }}-pnpm-project-${{ hashFiles('**/package.json','**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-project-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for outdated dependencies
        run: pnpm outdated || true

      - name: Prettier check
        run: pnpm run prettier:check

      - name: Type check
        run: pnpm run type-check

      - name: Security audit
        if: github.event_name == 'push'
        run: pnpm audit

      - name: Lint (no warnings)
        run: pnpm lint --max-warnings=0

      - name: Run tests (with coverage)
        env:
          CI: true
        run: pnpm run test:ci

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml

      - name: Show workspace files for diagnostics
        if: always()
        run: |
          echo "Working directory: $(pwd)"
          echo "List root files:"; ls -la
          echo "List coverage dir (if present):"; ls -la coverage || true

      - name: Check for coverage file
        id: coverage-check
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "coverage_exists=true" >> $GITHUB_OUTPUT
          else
            echo "coverage_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage
        if: always() && steps.coverage-check.outputs.coverage_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Upload to Codecov (GitHub App)
        if: always() && steps.coverage-check.outputs.coverage_exists == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          flags: unittests
          # Do not fail the CI if upload fails when using the GitHub App
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Enforce coverage threshold (PRs - tolerant)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          if [ -f coverage/lcov.info ]; then
            node ./scripts/check-coverage.mjs 70
          else
            echo "No coverage/lcov.info found — skipping coverage enforcement for PR"
          fi

      - name: Enforce coverage threshold (push to main - strict)
        if: always() && github.event_name == 'push'
        run: |
          if [ -f coverage/lcov.info ]; then
            node ./scripts/check-coverage.mjs 70
          else
            echo "No coverage/lcov.info found — failing because this is a push to main"
            exit 2
          fi

      - name: Build
        run: pnpm build